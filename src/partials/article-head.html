<script type="application/ld+json">{{article_ld}}</script>
<div class="readbar" aria-hidden="true"><i></i></div>
<main>
<section class="hero hero--page hero--article dark" data-theme="dark">
  <div class="hero__bg">
    <div class="hero__grid"></div>
    <div class="hero__glow"></div>
  </div>
  <div class="hero__art hero__art--cover cover cover--dark" aria-hidden="true">{{cover_svg}}</div>
  <div class="container hero__inner">
    <div class="hero__copy">
      <p class="eyebrow" data-reveal><a href="{{base}}blog.html">Le journal</a>&nbsp;&nbsp;·&nbsp;&nbsp;{{category}}</p>
      <h1 class="hero__title" data-split>{{h1}}</h1>
      <p class="lead hero__lead" data-reveal>{{chapo}}</p>
      <div class="article__meta" data-reveal>
        <span class="who"><img class="article__avatar" src="{{base}}assets/img/david-hubschwerlin.webp" width="44" height="44" alt="" loading="lazy"><span><b>David Hubschwerlin</b><small>Agent Général AXA · Courtier</small></span></span>
        <i class="dot" aria-hidden="true"></i><time datetime="{{date}}">{{date_fr}}</time>
        <i class="dot" aria-hidden="true"></i><span>{{read}} de lecture</span>
      </div>
    </div>
  </div>
</section>

<section class="section paper" data-theme="light">
  <div class="container article__layout">
    <aside class="toc" aria-label="Sommaire">
      <h4>Sommaire</h4>
      <nav></nav>
      <a class="toc__back link" href="{{base}}blog.html"><span>← Tous les articles</span></a>
    </aside>
